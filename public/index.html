<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess With Friends</title>
<style>
  :root {
    --bg: #14161a; --panel: #1d2026; --line: #2b2f37; --text: #e8eaee; --muted: #8b92a0;
    --accent: #7cc576; --bad: #ff7b72; --light: #ebecd0; --dark: #739552; --sel: #f6f669aa; --move: #00000030; --last: #f6f66955;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, system-ui, "Segoe UI", sans-serif; min-height: 100vh; }
  h1 { font-size: 2rem; margin: 0 0 4px; }
  button, select { font: inherit; cursor: pointer; border: 0; border-radius: 10px; padding: 12px 18px; background: var(--line); color: var(--text); }
  select { padding: 12px 10px; }
  button:hover { filter: brightness(1.15); }
  button.primary { background: var(--accent); color: #10200e; font-weight: 700; }
  button.small { padding: 6px 12px; font-size: .85rem; }
  button:disabled { opacity: .4; cursor: default; }
  input { font: inherit; padding: 12px 14px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); color: var(--text); text-align: center; width: 10em; }
  input.code { text-transform: uppercase; letter-spacing: .3em; width: 8em; }
  input:focus { outline: none; border-color: var(--accent); }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }

  .wrap { max-width: 920px; margin: 0 auto; padding: 24px 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
  .card h2 { margin: 0 0 12px; font-size: .85rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .center { text-align: center; justify-content: center; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
  #err, #werr { color: var(--bad); min-height: 1.4em; margin-top: 8px; }
  .colorpick button.on { outline: 2px solid var(--accent); }
  .me { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .elo { font-weight: 800; color: var(--accent); }

  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 8px 6px; text-align: left; border-top: 1px solid var(--line); }
  th { color: var(--muted); font-size: .8rem; font-weight: 600; border-top: 0; }
  td.r, th.r { text-align: right; }
  tr.you td { color: var(--accent); font-weight: 700; }
  .banner { background: #26331f; border: 1px solid #3c5a30; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .banner.warn { background: #33231f; border-color: #5a3c30; }

  #game { max-width: 1000px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
  @media (max-width: 760px) { #game { grid-template-columns: 1fr; } }
  .player { display: flex; align-items: center; gap: 8px; padding: 6px 4px; font-weight: 600; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #555; flex: none; }
  .dot.on { background: var(--accent); }
  .clock { margin-left: auto; font: 700 1.3rem ui-monospace, Menlo, monospace; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 2px 10px; }
  .clock.active { background: var(--accent); color: #10200e; }
  .clock.low { background: var(--bad); color: #fff; }
  .delta { font-size: .85rem; font-weight: 700; }
  .delta.pos { color: var(--accent); } .delta.neg { color: var(--bad); }
  #board { display: grid; grid-template-columns: repeat(8, 1fr); aspect-ratio: 1; border-radius: 8px; overflow: hidden; user-select: none; touch-action: manipulation; }
  .sq { position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; container-type: size; }
  .sq.l { background: var(--light); } .sq.d { background: var(--dark); }
  .sq.last::before { content: ""; position: absolute; inset: 0; background: var(--last); }
  .sq.sel::before { content: ""; position: absolute; inset: 0; background: var(--sel); }
  .sq.check { background: radial-gradient(circle, #ff3b3b 0%, #ff3b3b66 55%, transparent 75%), var(--light); }
  .sq.d.check { background: radial-gradient(circle, #ff3b3b 0%, #ff3b3b66 55%, transparent 75%), var(--dark); }
  .sq.hint::after { content: ""; position: absolute; width: 28%; height: 28%; border-radius: 50%; background: var(--move); }
  .sq.hint.cap::after { width: 90%; height: 90%; background: transparent; border: 6px solid var(--move); }
  .sq .coord { position: absolute; font-size: .7rem; font-weight: 700; opacity: .7; pointer-events: none; }
  .sq.l .coord { color: var(--dark); } .sq.d .coord { color: var(--light); }
  .coord.f { right: 3px; bottom: 1px; } .coord.r { left: 3px; top: 1px; }
  .piece { font-size: 11cqmin; line-height: 1; position: relative; z-index: 1; font-family: "Segoe UI Symbol", "Apple Symbols", "Noto Sans Symbols 2", serif; }
  .piece.w { color: #fff; -webkit-text-stroke: 1.2px #222; text-shadow: 0 1px 2px #0006; }
  .piece.b { color: #1c1c1c; -webkit-text-stroke: .6px #000; text-shadow: 0 1px 1px #fff3; }

  aside .card { padding: 16px; }
  #status { font-weight: 700; font-size: 1.1rem; margin-bottom: 4px; }
  #sub { color: var(--muted); font-size: .9rem; }
  .gcode { font: 700 2rem ui-monospace, Menlo, monospace; letter-spacing: .25em; color: var(--accent); }
  #moves { max-height: 260px; overflow-y: auto; display: grid; grid-template-columns: 2.2em 1fr 1fr; gap: 2px 8px; font: .9rem ui-monospace, Menlo, monospace; }
  #moves .n { color: var(--muted); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .actions button { flex: 1; padding: 10px; }

  #promo { position: fixed; inset: 0; background: #000a; display: flex; align-items: center; justify-content: center; z-index: 10; }
  #promo .box { background: var(--panel); padding: 16px; border-radius: 14px; display: flex; gap: 8px; }
  #promo button { font-size: 3rem; padding: 6px 14px; }
</style>
</head>
<body>

<!-- sign in -->
<div id="welcome" class="wrap center hidden" style="max-width:460px;margin-top:10vh">
  <h1>♞ Chess With Friends</h1>
  <p class="muted">Pick a name. Your rating follows it.</p>
  <div class="card">
    <div class="row center">
      <input id="nameIn" maxlength="16" placeholder="your name" autocomplete="off">
      <button class="primary" id="go">Let's play</button>
    </div>
    <div id="werr"></div>
  </div>
</div>

<!-- lobby -->
<div id="lobby" class="wrap hidden">
  <div class="me">
    <h1>♞ Chess</h1>
    <div><span id="meName"></span> · <span class="elo" id="meElo"></span> <span class="muted" id="meRec"></span>
      <button class="small" id="signout" style="margin-left:8px">Sign out</button></div>
  </div>
  <div id="banners"></div>
  <div class="cols">
    <div>
      <div class="card">
        <h2>Time control</h2>
        <select id="tc">
          <optgroup label="Bullet"><option value="60,0">1 + 0</option><option value="120,1">2 + 1</option></optgroup>
          <optgroup label="Blitz"><option value="180,0">3 + 0</option><option value="180,2">3 + 2</option><option value="300,0" selected>5 + 0</option></optgroup>
          <optgroup label="Rapid"><option value="600,0">10 + 0</option><option value="900,10">15 + 10</option></optgroup>
          <optgroup label="Classical"><option value="1800,0">30 + 0</option><option value="5400,30">90 + 30</option></optgroup>
          <optgroup label="Casual"><option value="0,0">No clock</option></optgroup>
        </select>
        <span class="muted" style="font-size:.85rem">minutes + seconds per move</span>
      </div>
      <div class="card">
        <h2>Create a game</h2>
        <div class="row colorpick" style="margin-bottom:12px">
          <button data-c="w">White</button><button data-c="r" class="on">Random</button><button data-c="b">Black</button>
        </div>
        <button class="primary" id="create">Create game & get code</button>
      </div>
      <div class="card">
        <h2>Join with a code</h2>
        <div class="row">
          <input id="code" class="code" maxlength="5" placeholder="ABCDE" autocomplete="off">
          <button class="primary" id="join">Join</button>
        </div>
      </div>
      <div class="card">
        <h2>Challenge a player</h2>
        <div class="row">
          <input id="chName" placeholder="their name" maxlength="16" autocomplete="off">
          <button class="primary" id="chBtn">Challenge</button>
        </div>
      </div>
      <div id="err"></div>
    </div>
    <div class="card">
      <h2>🏆 Leaderboard</h2>
      <table><thead><tr><th>#</th><th>Player</th><th class="r">Elo</th><th class="r">W-L-D</th><th></th></tr></thead>
      <tbody id="lb"></tbody></table>
    </div>
  </div>
</div>

<!-- game -->
<div id="game" class="hidden">
  <main>
    <div class="player" id="top"></div>
    <div id="board"></div>
    <div class="player" id="bottom"></div>
  </main>
  <aside>
    <div class="card"><div id="status"></div><div id="sub"></div></div>
    <div class="card" id="invite">
      <div class="muted" style="font-size:.85rem">Game code — send this to your friend</div>
      <div class="gcode" id="gcode"></div>
      <div class="actions" style="margin-top:10px">
        <button id="copyCode">Copy code</button><button id="copyLink">Copy link</button>
      </div>
    </div>
    <div class="card"><div id="moves"></div></div>
    <div class="actions">
      <button id="resign">Resign</button>
      <button id="rematch" class="primary hidden">Rematch</button>
      <button id="leave">Lobby</button>
    </div>
  </aside>
</div>

<div id="promo" class="hidden"><div class="box"></div></div>

<script src="chess.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const GLYPH = { K: '♚', Q: '♛', R: '♜', B: '♝', N: '♞', P: '♟' };
const show = (id) => ['welcome', 'lobby', 'game'].forEach((v) => $('#' + v).classList.toggle('hidden', v !== id));

let user = null;       // { name, token, elo, ... }
let view = 'welcome';
let pickColor = 'r';
let lobbyTimer = null, gameTimer = null, clockTimer = null;
let gameCode = null, snap = null, snapAt = 0, sig = '';
let selected = null, legal = [];

async function api(route, body) {
  const headers = { 'Content-Type': 'application/json' };
  if (user) { headers['x-name'] = user.name; headers['x-token'] = user.token; }
  try {
    const r = await fetch('/api?r=' + route, { method: 'POST', headers, body: JSON.stringify(body || {}) });
    const j = await r.json().catch(() => ({ error: 'Bad response.' }));
    return { ok: r.ok, status: r.status, ...j };
  } catch { return { ok: false, error: 'Connection problem.' }; }
}
const tcOf = () => { const [base, inc] = $('#tc').value.split(',').map(Number); return base ? { base, inc } : null; };
const tcLabel = (tc) => (tc ? `${tc.base / 60} + ${tc.inc}` : 'No clock');

// ---------- sign in ----------
async function login(name, token) {
  const r = await api('register', { name, token });
  if (!r.ok) return r;
  user = { name: r.name, token: r.token };
  localStorage.setItem('chess:user', JSON.stringify(user));
  return r;
}
$('#go').onclick = async () => {
  const r = await login($('#nameIn').value, null);
  if (!r.ok) return ($('#werr').textContent = r.error);
  start();
};
$('#nameIn').addEventListener('keydown', (e) => e.key === 'Enter' && $('#go').click());
$('#signout').onclick = () => { localStorage.removeItem('chess:user'); location.href = '/'; };

async function boot() {
  const saved = (() => { try { return JSON.parse(localStorage.getItem('chess:user')); } catch { return null; } })();
  if (saved && (await login(saved.name, saved.token)).ok) return start();
  show('welcome');
}
async function start() {
  const q = new URLSearchParams(location.search).get('game');
  if (q) { const r = await api('join', { code: q }); if (r.ok) return enterGame(r.code); }
  enterLobby();
}

// ---------- lobby ----------
document.querySelectorAll('.colorpick button').forEach((b) => b.onclick = () => {
  document.querySelectorAll('.colorpick button').forEach((x) => x.classList.remove('on'));
  b.classList.add('on'); pickColor = b.dataset.c;
});
$('#create').onclick = async () => {
  const r = await api('create', { color: pickColor === 'r' ? null : pickColor, tc: tcOf() });
  r.ok ? enterGame(r.code) : ($('#err').textContent = r.error);
};
$('#join').onclick = async () => {
  const r = await api('join', { code: $('#code').value.trim().toUpperCase() });
  r.ok ? enterGame(r.code) : ($('#err').textContent = r.error);
};
$('#code').addEventListener('keydown', (e) => e.key === 'Enter' && $('#join').click());
async function challenge(name) {
  const r = await api('challenge', { to: name, tc: tcOf() });
  $('#err').textContent = r.ok ? '' : r.error;
  pollLobby();
}
$('#chBtn').onclick = () => challenge($('#chName').value);
$('#chName').addEventListener('keydown', (e) => e.key === 'Enter' && $('#chBtn').click());

function enterLobby() {
  stopGame(); gameCode = null; view = 'lobby';
  history.replaceState(null, '', '/');
  show('lobby'); $('#err').textContent = '';
  pollLobby();
  lobbyTimer = setInterval(pollLobby, 2500);
}
function stopLobby() { clearInterval(lobbyTimer); lobbyTimer = null; }

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function pollLobby() {
  if (view !== 'lobby') return;
  const r = await api('me');
  if (view !== 'lobby') return;
  if (r.status === 401) { localStorage.removeItem('chess:user'); return location.reload(); }
  if (!r.ok) return;
  $('#meName').textContent = r.user.name;
  $('#meElo').textContent = r.user.elo;
  $('#meRec').textContent = `${r.user.w}W ${r.user.l}L ${r.user.d}D`;

  let html = '';
  for (const c of r.inbox)
    html += `<div class="banner"><span>⚔️ <b>${esc(c.from)}</b> (${c.fromElo}) challenges you — ${tcLabel(c.tc)}</span>
      <span><button class="primary small" data-a="accept" data-id="${c.id}">Accept</button>
      <button class="small" data-a="decline" data-id="${c.id}">Decline</button></span></div>`;
  const o = r.outbox;
  if (o && o.status === 'pending')
    html += `<div class="banner"><span>Waiting for <b>${esc(o.to)}</b> to accept…</span><button class="small" data-a="cancel">Cancel</button></div>`;
  if (o && o.status === 'declined') {
    html += `<div class="banner warn"><span><b>${esc(o.to)}</b> declined your challenge.</span><button class="small" data-a="cancel">OK</button></div>`;
  }
  $('#banners').innerHTML = html;
  $('#banners').querySelectorAll('button').forEach((b) => b.onclick = async () => {
    const a = b.dataset.a;
    const res = await api(a, { id: b.dataset.id });
    if (a === 'accept') return res.ok ? enterGame(res.code) : ($('#err').textContent = res.error);
    pollLobby();
  });
  if (o && o.status === 'accepted') { await api('cancel'); return enterGame(o.code); }

  $('#lb').innerHTML = r.leaderboard.map((p, i) => `<tr class="${p.name === r.user.name ? 'you' : ''}">
    <td>${i + 1}</td><td>${esc(p.name)}</td><td class="r">${p.elo}</td><td class="r muted">${p.w}-${p.l}-${p.d}</td>
    <td class="r">${p.name === r.user.name ? '' : `<button class="small" data-ch="${esc(p.name)}">Challenge</button>`}</td></tr>`).join('');
  $('#lb').querySelectorAll('[data-ch]').forEach((b) => b.onclick = () => challenge(b.dataset.ch));
}

// ---------- game ----------
function enterGame(code) {
  stopLobby(); view = 'game'; gameCode = code; snap = null; sig = ''; selected = null; legal = [];
  history.replaceState(null, '', '?game=' + code);
  show('game');
  $('#gcode').textContent = code;
  pollGame();
  clockTimer = setInterval(drawClocks, 200);
}
function stopGame() { clearTimeout(gameTimer); clearInterval(clockTimer); gameTimer = null; clockTimer = null; }
$('#leave').onclick = enterLobby;
$('#copyCode').onclick = () => copy(gameCode, '#copyCode');
$('#copyLink').onclick = () => copy(location.origin + '/?game=' + gameCode, '#copyLink');
function copy(t, sel) { navigator.clipboard.writeText(t).then(() => { const b = $(sel), o = b.textContent; b.textContent = 'Copied!'; setTimeout(() => b.textContent = o, 1200); }); }
$('#resign').onclick = async () => { if (confirm('Resign this game?')) { await api('resign', { code: gameCode }); pollGame(true); } };
$('#rematch').onclick = async () => { await api('rematch', { code: gameCode }); pollGame(true); };

async function pollGame(once) {
  if (view !== 'game') return;
  clearTimeout(gameTimer);
  const r = await api('room', { code: gameCode });
  if (view !== 'game') return;
  if (r.ok) {
    snap = r; snapAt = Date.now();
    const s = [r.moves.length, r.you, r.status.over, r.present.w, r.present.b, r.rematch.join(), r.players.w && r.players.w.name, r.players.b && r.players.b.name, r.delta && r.delta.w].join('|');
    if (s !== sig) {
      if (!sig || sig.split('|')[0] !== String(r.moves.length) || sig.split('|')[1] !== r.you) { selected = null; legal = []; }
      sig = s; render();
    }
  } else if (r.status === 404 || r.status === 401) { return enterLobby(); }
  gameTimer = setTimeout(pollGame, 1000);
}

function fmt(ms) {
  if (ms == null) return '';
  if (ms < 10000) return (ms / 1000).toFixed(1);
  const s = Math.ceil(ms / 1000);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}
function drawClocks() {
  if (!snap || !snap.clock) return;
  const age = Date.now() - snapAt;
  for (const c of ['w', 'b']) {
    const el = document.querySelector(`.clock[data-c="${c}"]`);
    if (!el) continue;
    const running = snap.clock.running === c;
    const ms = Math.max(0, snap.clock[c] - (running ? age : 0));
    el.textContent = fmt(ms);
    el.classList.toggle('active', running);
    el.classList.toggle('low', running && ms < 10000);
  }
}

function render() {
  const { state, status, last, present, moves, players, you } = snap;
  const flip = you === 'b';
  const mine = you === 'w' || you === 'b';
  const bd = $('#board'); bd.innerHTML = '';
  const kingSq = status.check ? state.board.indexOf(state.turn + 'K') : -1;
  const targets = new Map(legal.filter((m) => m.from === selected).map((m) => [m.to, m]));

  for (let i = 0; i < 64; i++) {
    const sq = flip ? 63 - i : i;
    const r = sq >> 3, c = sq & 7;
    const el = document.createElement('div');
    el.className = 'sq ' + ((r + c) % 2 ? 'd' : 'l');
    if (last && (sq === last.from || sq === last.to)) el.classList.add('last');
    if (sq === selected) el.classList.add('sel');
    if (sq === kingSq) el.classList.add('check');
    if (targets.has(sq)) { el.classList.add('hint'); if (state.board[sq] || targets.get(sq).enPassant) el.classList.add('cap'); }
    const p = state.board[sq];
    if (p) el.innerHTML = `<span class="piece ${p[0]}">${GLYPH[p[1]]}︎</span>`;
    if (i % 8 === 0) el.insertAdjacentHTML('beforeend', `<span class="coord r">${8 - (flip ? 7 - (i >> 3) : (i >> 3))}</span>`);
    if (i >= 56) el.insertAdjacentHTML('beforeend', `<span class="coord f">${'abcdefgh'[flip ? 7 - (i & 7) : (i & 7)]}</span>`);
    el.onclick = () => clickSquare(sq);
    bd.appendChild(el);
  }

  const bar = (c) => {
    const p = players[c];
    const d = snap.delta ? snap.delta[c] : null;
    const dtxt = d == null ? '' : ` <span class="delta ${d >= 0 ? 'pos' : 'neg'}">${d >= 0 ? '+' : ''}${d}</span>`;
    const elo = p ? ` <span class="muted">(${p.elo}${p.name ? '' : ''})</span>${dtxt}` : '';
    const clock = snap.clock ? `<span class="clock" data-c="${c}"></span>` : '';
    return `<span class="dot ${present[c] ? 'on' : ''}"></span>${p ? esc(p.name) : '<span class="muted">waiting for player…</span>'}${p && p.name === user.name ? ' <span class="muted">(you)</span>' : ''}${elo}${clock}`;
  };
  $('#top').innerHTML = bar(flip ? 'w' : 'b');
  $('#bottom').innerHTML = bar(flip ? 'b' : 'w');
  drawClocks();

  let t, s = '';
  if (status.over) {
    const winner = status.result;
    t = winner === 'draw' ? `Draw — ${status.reason}` : `${winner === 'w' ? 'White' : 'Black'} wins by ${status.reason}`;
    if (mine && winner !== 'draw') t = winner === you ? `🎉 You win! (${status.reason})` : `You lose (${status.reason})`;
    if (snap.delta && mine) s = `Rating ${snap.delta[you] >= 0 ? '+' : ''}${snap.delta[you]}`;
  } else if (!players.w || !players.b) {
    t = 'Waiting for your friend…'; s = `Share the code ${gameCode} · ${tcLabel(snap.tc)}`;
  } else if (!mine) {
    t = `${state.turn === 'w' ? 'White' : 'Black'} to move`; s = 'You are spectating';
  } else {
    t = state.turn === you ? 'Your move' : "Opponent's move";
    s = status.check ? 'Check!' : tcLabel(snap.tc);
  }
  $('#status').textContent = t; $('#sub').textContent = s;

  $('#invite').classList.toggle('hidden', !!(players.w && players.b));
  $('#resign').classList.toggle('hidden', !mine || status.over || !players.w || !players.b);
  const rm = $('#rematch');
  rm.classList.toggle('hidden', !mine || !status.over);
  const asked = snap.rematch.includes(you);
  rm.textContent = asked ? 'Waiting for opponent…' : snap.rematch.length ? 'Accept rematch' : 'Rematch';
  rm.disabled = asked;

  let html = '';
  for (let i = 0; i < moves.length; i += 2)
    html += `<span class="n">${i / 2 + 1}.</span><span>${moves[i]}</span><span>${moves[i + 1] || ''}</span>`;
  const ml = $('#moves'); ml.innerHTML = html; ml.scrollTop = ml.scrollHeight;
}

function clickSquare(sq) {
  if (!snap || snap.status.over || !snap.players.w || !snap.players.b) return;
  const { state, you } = snap;
  if (state.turn !== you) return;
  if (selected !== null) {
    const cand = legal.filter((m) => m.from === selected && m.to === sq);
    if (cand.length) return cand[0].promo ? askPromo(selected, sq) : send(selected, sq);
  }
  const p = state.board[sq];
  if (p && p[0] === you && sq !== selected) { selected = sq; legal = Chess.legalMoves(state); }
  else selected = null;
  render();
}

async function send(from, to, promo) {
  selected = null; legal = [];
  const r = await api('move', { code: gameCode, from, to, promo });
  if (!r.ok) $('#sub').textContent = r.error;
  pollGame();
}

function askPromo(from, to) {
  const box = $('#promo .box'); box.innerHTML = '';
  for (const k of 'QRBN') {
    const b = document.createElement('button');
    b.innerHTML = `<span class="piece ${snap.you}" style="font-size:3rem">${GLYPH[k]}︎</span>`;
    b.onclick = () => { $('#promo').classList.add('hidden'); send(from, to, k); };
    box.appendChild(b);
  }
  $('#promo').classList.remove('hidden');
}

boot();
</script>
</body>
